<!DOCTYPE html>
<html lang="es">
<head>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
  }
}
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi galaxia de amor ❤️</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03020b;
      font-family: Georgia, serif;
    }

    #galaxia {
      position: fixed;
      inset: 0;
    }

    .controles {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 5;
    }

    button {
      padding: 12px 18px;
      border: 1px solid #ff9cdd;
      border-radius: 24px;
      background: #34102f;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="galaxia"></div>

  <div class="controles">
    <button id="giro">Pausar giro</button>
    <button id="reiniciar">Reiniciar vista</button>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
